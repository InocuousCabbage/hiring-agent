  - id: "proj_007"
    name: "AI-Built Production CRM Deduplication Tool"
    lane: ["mops"]
    company: "{{USER_COMPANY}}"
    date_range: "2025 (launch target Q3 2025)"
    summary: >
      Designed and built a production CRM deduplication tool that identifies,
      scores, and merges duplicate records using multi-attribute matching and
      completeness-based canonical selection. Built AI-assisted in Python for
      deployment on the company's Dynamics 365 environment.
    bullets:
      - "Designed multi-attribute matching logic identifying duplicates by email, phone, name similarity, and address"
      - "Built a record-completeness scoring model incorporating HubSpot sync status, NetSuite sync status, field-fill coverage, and related-entity connections (opportunities, projects)"
      - "Implemented canonical-record selection based on completeness score, with automated merge for clear score gaps"
      - "Designed a manual-review flagging path for close-score duplicates that require human judgment"
      - "Deployed against the production Dynamics 365 CRM environment"
      - "Built end-to-end in Python using AI-assisted development"
    metrics:
      - "Identified ~30,000 duplicate records in the production CRM"
      - "Automated merge logic for high-confidence duplicates, manual-review flag for close-score cases"
      - "Reduces long-standing CRM data quality debt affecting marketing outreach accuracy"
    tools_used:
      - "Python"
      - "Dynamics 365"
      - "HubSpot"
      - "NetSuite"
      - "Claude (AI-assisted development)"
    tags:
      - "data quality"
      - "CRM hygiene"
      - "AI-assisted development"
      - "deduplication"
      - "Python"
      - "production tooling"
      - "internal tools"
